server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http: https:;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/x-font-ttf font/opentype image/svg+xml;

    # Build output has content-hashed names - safe to cache forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Other assets (favicon, vendor scripts) keep their names across
    # deploys, so only cache them briefly.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        access_log off;
    }

    # Translations change with every release - always revalidate (ETag)
    location /locales/ {
        expires -1;
        try_files $uri =404;
    }

    # index.html names the current bundle - always revalidate, otherwise
    # browsers keep running the previous build after a deploy.
    # (expires -1 sends Cache-Control: no-cache and keeps the server-level
    # security headers, which add_header here would drop.)
    location ~* \.(html)$ {
        expires -1;
    }

    # API proxy — routes /api requests to the backend nginx container.
    # Requires NGINX_API_UPSTREAM env var (defaults to nginx:80 for Docker Compose).
    # When behind an external reverse proxy (e.g. Nginx Proxy Manager),
    # the proxy handles /api routing and this block is not reached.
    location /api/ {
        proxy_pass http://nginx:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 512M;
    }

    location /uploads/ {
        proxy_pass http://nginx:80/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
