# Builds the Vehicle Manager Android APK locally - same toolchain and signing
# as the GitHub release workflow (.github/workflows/mobile-release.yml).
#
# Usage:
#   MOBILE_VERSION=1.1.1 docker compose -f docker-compose.mobile.yml up --build
#
# Output: mobile/output/vehicle-manager-<version>.apk (+ .sha256)
# Needs an x86_64 host (Android build tools are x86_64-only) and ~8 GB RAM.
# Use a version higher than the one installed, or Android refuses the update.

services:
  mobile-build:
    build:
      context: ./mobile
      dockerfile: docker/Dockerfile
    platform: linux/amd64
    # One-shot build container - the default bridge is all it needs (no
    # project network, which also avoids exhausting Docker's address pools).
    network_mode: bridge
    container_name: vehicle-mobile-build
    environment:
      MOBILE_VERSION: ${MOBILE_VERSION:-}
      BUILD_VARIANT: ${BUILD_VARIANT:-release}
      RUN_TESTS: ${RUN_TESTS:-0}
      # Optional release signing - mount the keystore and set these
      ORG_GRADLE_PROJECT_VEHICLE_RELEASE_STORE_FILE: ${ANDROID_KEYSTORE_FILE:-}
      ORG_GRADLE_PROJECT_VEHICLE_RELEASE_STORE_PASSWORD: ${ANDROID_KEYSTORE_PASSWORD:-}
      ORG_GRADLE_PROJECT_VEHICLE_RELEASE_KEY_ALIAS: ${ANDROID_KEY_ALIAS:-}
      ORG_GRADLE_PROJECT_VEHICLE_RELEASE_KEY_PASSWORD: ${ANDROID_KEY_PASSWORD:-}
    volumes:
      - ./mobile/output:/app/output
      - gradle-cache:/root/.gradle

volumes:
  gradle-cache:
